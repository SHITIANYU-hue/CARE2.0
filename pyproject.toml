[project]
name = "care2"
version = "0.1.0"
description = "Evidence-grounded experimental transfer and auditable replay for CARE 2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
descriptors = ["rdkit>=2024.3"]
embeddings = [
    "sentence-transformers>=3",
    "torch>=2.2",
]
astabench = ["care2-astabench"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
required-version = ">=0.12.9"

[tool.uv.workspace]
members = ["experiments/astabench"]

[tool.uv.sources]
care2-astabench = { workspace = true }
# Local embeddings use CPU PyTorch on Linux/Windows; macOS uses PyPI wheels.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
