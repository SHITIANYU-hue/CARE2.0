[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "care2-astabench"
version = "0.1.0"
description = "CARE 2.0 solver and evidence audits for AstaBench"
requires-python = ">=3.11"
dependencies = [
    "astabench==0.5.3",
    "inspect-ai==0.3.203",
    "matplotlib==3.10.5",
]

[dependency-groups]
dev = ["pytest==8.4.1"]

[tool.setuptools]
py-modules = ["care_astabench_solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
